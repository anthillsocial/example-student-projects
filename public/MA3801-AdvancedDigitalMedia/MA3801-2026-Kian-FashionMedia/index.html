<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    user-select: none;
    -webkit-user-drag: none;
  }
  #stage img.on { opacity: 1; }
  #stage:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
</style>
</head>
<body>
<div id="stage" tabindex="0" role="button" aria-label="Next image"></div>

<script>
(function () {
  var files = [
    "ALICE_IMG1.jpg",  "ALICE_IMG2.jpg",  "ALICE_IMG3.jpg",  "ALICE_IMG4.jpg",
    "AMELIA_IMG1.jpg", "AMELIA_IMG2.png", "AMELIA_IMG3.jpg", "AMELIA_IMG4.png",
    "ROYA_IMG1.jpg",   "ROYA_IMG2.jpg",   "ROYA_IMG3.jpg",   "ROYA_IMG4.jpg",
    "SIENNA_IMG1.jpg", "SIENNA_IMG2.jpg", "SIENNA_IMG3.jpg", "SIENNA_IMG4.jpg"
  ];

  var stage = document.getElementById("stage");
  var imgs = files.map(function (f, i) {
    var img = document.createElement("img");
    img.alt = f.replace(/\.[^.]+$/, "").replace(/_/g, " ");
    img.draggable = false;
    img.src = f;               // all load up front so switching is instant
    stage.appendChild(img);
    return img;
  });

  var current = 0;
  function show(n) {
    imgs[current].classList.remove("on");
    current = (n + imgs.length) % imgs.length;
    imgs[current].classList.add("on");
    location.hash = current + 1;
  }

  var start = parseInt(location.hash.slice(1), 10);
  current = start >= 1 && start <= imgs.length ? start - 1 : 0;
  imgs[current].classList.add("on");

  stage.addEventListener("click", function () { show(current + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); show(current + 1); }
    if (e.key === "ArrowLeft") { show(current - 1); }
  });
})();
</script>
</body>
</html>
